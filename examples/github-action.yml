# Reviewed source-preview scanner; review this commit and future updates yourself.
# The new init --mode action generator is added after this scanner commit.
# Target files are read as data. Reports stay outside the target checkout.
name: wakeio-security-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: wakeio-source
      - name: Run pinned Wakeio Action
        id: wakeio
        uses: dusen0528/wakeio-security-ci@575dbff63c6adc36e327487a2a9a2ead8337b4f0
        with:
          source: wakeio-source
          tools: none
          out: "wakeio-security-reports/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wakeio-security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: "wakeio-security-reports/${{ github.run_id }}-${{ github.run_attempt }}"
          if-no-files-found: error
