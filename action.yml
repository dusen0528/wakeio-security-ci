name: Wakeio Security CI
description: Run local source and URL security checks and write JSON, SARIF, Markdown, and agent reports
author: Wakeio Security CI contributors

inputs:
  source:
    description: Checkout-relative source directory to inspect
    required: false
    default: ''
  url:
    description: HTTP(S) URL to inspect with bounded same-origin GET requests
    required: false
    default: ''
  pages:
    description: Optional newline or comma-separated additional same-origin URL pages
    required: false
    default: ''
  api-policy:
    description: Checkout-relative JSON authorization policy; credentials are read from its named environment variables
    required: false
    default: ''
  out:
    description: Directory for report.json, report.sarif, report.md, agent-report.json, and Action status
    required: false
    default: wakeio-security-reports
  tools:
    description: Comma-separated source scanner set, or none
    required: false
    default: gitleaks,osv,trivy
  require-code-analysis:
    description: Require completed code analysis for every collected code input (not whole-project safety)
    required: false
    default: 'false'
  analysis-profile:
    description: Versioned AST workload preset, default or extended (extended requires source)
    required: false
    default: default
  source-max-files:
    description: Optional selected-file cap, integer 1..10000 (source only; default 1000)
    required: false
    default: ''
  source-max-bytes:
    description: Optional total collected-byte cap, integer 1..134217728 (source only; default 26214400; per-file cap unchanged)
    required: false
    default: ''
  fail-on:
    description: Severity threshold for findings (none disables finding failure only)
    required: false
    default: high
  allow-private:
    description: Allow explicitly local/private URL targets
    required: false
    default: 'false'
  timeout-ms:
    description: Per-check timeout in milliseconds
    required: false
    default: '30000'
  max-pages:
    description: Maximum total URL pages including the root page
    required: false
    default: ''
  osv-offline:
    description: Require a preloaded OSV database instead of querying the public service
    required: false
    default: 'false'
  bandit-path:
    description: Optional preinstalled trusted Bandit executable for Python source scans
    required: false
    default: ''
  semgrep-path:
    description: Prepared Semgrep CE executable for bundled WakeIO Go rules
    required: false
    default: ''
  govulncheck-path:
    description: Prepared govulncheck executable; requires a prepared Go toolchain
    required: false
    default: ''
  go-path:
    description: Prepared Go executable; no automatic toolchain download
    required: false
    default: ''
  go-module-cache:
    description: Prepared Go module cache; target dependencies are never installed by scan
    required: false
    default: ''
  govuln-db:
    description: Optional Go vulnerability database URL
    required: false
    default: ''
  image-archive:
    description: Explicit Docker or OCI archive to scan in addition to source; no build or pull
    required: false
    default: ''
  trivy-cache:
    description: Optional prepared or reusable Trivy vulnerability database cache
    required: false
    default: ''
  trivy-offline:
    description: Disable Trivy CVE database updates; prepared database required
    required: false
    default: 'false'
  project-id:
    description: Stable project identifier passed to the scanner (defaults to github.repository)
    required: false
    default: ''
  tool-cache:
    description: Optional persistent directory for verified native scanner archives
    required: false
    default: ''

outputs:
  report-dir:
    description: Absolute report directory used by the scanner
    value: ${{ steps.wakeio-run.outputs.report-dir }}
  report-json:
    description: Fresh current JSON report path; empty when unavailable
    value: ${{ steps.wakeio-run.outputs.report-json }}
  report-sarif:
    description: Fresh current SARIF report path; empty when missing, stale or unavailable
    value: ${{ steps.wakeio-run.outputs.report-sarif }}
  report-markdown:
    description: Fresh current Markdown report path; empty when missing, stale or unavailable
    value: ${{ steps.wakeio-run.outputs.report-markdown }}
  report-agent:
    description: Agent report path when bound to this run's fresh report.json; empty when unavailable, not a final CI success receipt
    value: ${{ steps.wakeio-run.outputs.report-agent }}
  exit-code:
    description: Action exit code (0 completed checked scope without threshold failure, 1 threshold findings, 2 incomplete/setup/delivery failure)
    value: ${{ steps.wakeio-run.outputs.exit-code }}
  scan-exit-code:
    description: Observed scanner child exit code 0, 1 or 2; empty when unavailable, separate from final Action gate
    value: ${{ steps.wakeio-run.outputs.scan-exit-code }}
  delivery-status:
    description: delivered or failed for status artifact and configured Action output writes; does not imply scan success
    value: ${{ steps.wakeio-run.outputs.delivery-status }}
  finding-count:
    description: Number of findings in report.json
    value: ${{ steps.wakeio-run.outputs.finding-count }}
  incomplete-count:
    description: Number of incomplete checks in report.json
    value: ${{ steps.wakeio-run.outputs.incomplete-count }}
  setup-status:
    description: Action setup status
    value: ${{ steps.wakeio-run.outputs.setup-status }}
  scan-status:
    description: Scan status
    value: ${{ steps.wakeio-run.outputs.scan-status }}

runs:
  using: composite
  steps:
    - name: Validate AST analysis profile
      shell: bash
      env:
        WAKEIO_SOURCE: ${{ inputs.source }}
        WAKEIO_REQUIRE_CODE_ANALYSIS: ${{ inputs.require-code-analysis }}
        WAKEIO_ANALYSIS_PROFILE: ${{ inputs.analysis-profile }}
        WAKEIO_SOURCE_MAX_FILES: ${{ inputs.source-max-files }}
        WAKEIO_SOURCE_MAX_BYTES: ${{ inputs.source-max-bytes }}
      run: |
        case "${WAKEIO_REQUIRE_CODE_ANALYSIS-false}" in
          false) ;;
          true) [[ "$WAKEIO_SOURCE" =~ [^[:space:]] ]] || { echo 'require-code-analysis requires source' >&2; exit 2; } ;;
          *) echo 'require-code-analysis must be true or false' >&2; exit 2 ;;
        esac
        case "$WAKEIO_ANALYSIS_PROFILE" in
          default) ;;
          extended) [[ "$WAKEIO_SOURCE" =~ [^[:space:]] ]] || { echo 'extended analysis-profile requires source' >&2; exit 2; } ;;
          *) echo 'analysis-profile must be default or extended' >&2; exit 2 ;;
        esac
        validate_limit() {
          local name="$1" value="$2" maximum="$3"
          [[ -z "$value" ]] && return 0
          [[ "$WAKEIO_SOURCE" =~ [^[:space:]] ]] || { echo "$name requires source" >&2; exit 2; }
          [[ "$value" =~ ^[1-9][0-9]*$ && ${#value} -le ${#maximum} ]] || { echo "$name must be an integer from 1 to $maximum" >&2; exit 2; }
          [[ "$value" -le "$maximum" ]] || { echo "$name must be an integer from 1 to $maximum" >&2; exit 2; }
        }
        validate_limit source-max-files "$WAKEIO_SOURCE_MAX_FILES" 10000
        validate_limit source-max-bytes "$WAKEIO_SOURCE_MAX_BYTES" 134217728
    - name: Set up Node.js 22
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Run Wakeio Security CI
      id: wakeio-run
      shell: bash
      env:
        WAKEIO_ACTION_PATH: ${{ github.action_path }}
        WAKEIO_SOURCE: ${{ inputs.source }}
        WAKEIO_REQUIRE_CODE_ANALYSIS: ${{ inputs.require-code-analysis }}
        WAKEIO_ANALYSIS_PROFILE: ${{ inputs.analysis-profile }}
        WAKEIO_SOURCE_MAX_FILES: ${{ inputs.source-max-files }}
        WAKEIO_SOURCE_MAX_BYTES: ${{ inputs.source-max-bytes }}
        WAKEIO_URL: ${{ inputs.url }}
        WAKEIO_PAGES: ${{ inputs.pages }}
        WAKEIO_API_POLICY: ${{ inputs.api-policy }}
        WAKEIO_OUT: ${{ inputs.out }}
        WAKEIO_TOOLS: ${{ inputs.tools }}
        WAKEIO_FAIL_ON: ${{ inputs.fail-on }}
        WAKEIO_ALLOW_PRIVATE: ${{ inputs.allow-private }}
        WAKEIO_TIMEOUT_MS: ${{ inputs.timeout-ms }}
        WAKEIO_MAX_PAGES: ${{ inputs.max-pages }}
        WAKEIO_OSV_OFFLINE: ${{ inputs.osv-offline }}
        WAKEIO_BANDIT_PATH: ${{ inputs.bandit-path }}
        WAKEIO_SEMGREP_PATH: ${{ inputs.semgrep-path }}
        WAKEIO_GOVULNCHECK_PATH: ${{ inputs.govulncheck-path }}
        WAKEIO_GO_PATH: ${{ inputs.go-path }}
        WAKEIO_GO_MODULE_CACHE: ${{ inputs.go-module-cache }}
        WAKEIO_GOVULN_DB: ${{ inputs.govuln-db }}
        WAKEIO_IMAGE_ARCHIVE: ${{ inputs.image-archive }}
        WAKEIO_TRIVY_CACHE: ${{ inputs.trivy-cache }}
        WAKEIO_TRIVY_OFFLINE: ${{ inputs.trivy-offline }}
        WAKEIO_PROJECT_ID: ${{ inputs.project-id }}
        WAKEIO_TOOL_CACHE: ${{ inputs.tool-cache }}
      run: node "$WAKEIO_ACTION_PATH/scripts/action-run.mjs"
