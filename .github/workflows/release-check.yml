name: release-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'

      - name: Prepare version-pinned Schemathesis environment
        timeout-minutes: 5
        run: node scripts/bootstrap-schemathesis.mjs

      - name: Install dependencies without lifecycle scripts
        timeout-minutes: 3
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run CI verification contracts and required real-engine suite
        timeout-minutes: 7
        run: |
          node --test scripts/ci-verification.test.mjs
          npm run test:schemathesis

      - name: Run supported benchmark corpus in strict mode
        timeout-minutes: 3
        run: npm run benchmark -- --strict

      - name: Declare exact release artifact paths
        id: release-files
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^[0-9A-Za-z][0-9A-Za-z.+-]*$/.test(version)) throw Error('invalid release version');
          const paths = { source: `artifacts/wakeio-security-ci-source-${version}.tar.gz`, npm: `artifacts/wakeio-security-ci-${version}.tgz`, sums: `artifacts/wakeio-security-ci-${version}-SHA256SUMS.txt` };
          for (const [key, value] of Object.entries(paths)) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          NODE

      - name: Build release artifacts locally
        timeout-minutes: 3
        run: npm run package:release

      - name: Verify release archive paths and checksums
        timeout-minutes: 2
        shell: bash
        env:
          SUMS_FILE: ${{ steps.release-files.outputs.sums }}
          SOURCE_ARCHIVE: ${{ steps.release-files.outputs.source }}
          NPM_ARCHIVE: ${{ steps.release-files.outputs.npm }}
        run: |
          set -euo pipefail
          sums_file="$SUMS_FILE"
          test -n "$sums_file"
          (cd artifacts && sha256sum -c "$(basename "$sums_file")")
          source_archive="$SOURCE_ARCHIVE"
          npm_archive="$NPM_ARCHIVE"
          test -n "$source_archive"
          test -n "$npm_archive"
          tar -tzf "$source_archive" | grep -Fx 'wakeio-security-ci/'
          tar -tzf "$source_archive" | grep -Fx 'wakeio-security-ci/src/'
          tar -tzf "$source_archive" | grep -Fx 'wakeio-security-ci/tests/'

      # This keeps a reviewable CI artifact only. There is deliberately no
      # npm token, npm publish, GitHub release upload, or registry mutation in
      # this workflow; publication remains a separate, explicitly authorized
      # release step after the package has been reviewed.
      - name: Upload checked artifacts for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wakeio-security-ci-release-check
          # Release files only; private replay/patch/field evidence never upload here.
          path: |
            ${{ steps.release-files.outputs.source }}
            ${{ steps.release-files.outputs.npm }}
            ${{ steps.release-files.outputs.sums }}
          if-no-files-found: warn
