name: wakeio-security-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: wakeio-source
      # Reviewed prebuilt scanner only. No target dependency installation or lifecycle scripts.
      # tools none supports local handoff; selecting external tools is a separate scan scope.
      - name: Run pinned Wakeio Action
        id: wakeio
        uses: dusen0528/wakeio-security-ci@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        with:
          source: wakeio-source
          tools: "none"
          out: "wakeio-security-reports/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wakeio-security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: "wakeio-security-reports/${{ github.run_id }}-${{ github.run_attempt }}"
          if-no-files-found: error
