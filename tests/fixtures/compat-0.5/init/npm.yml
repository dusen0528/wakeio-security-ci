name: wakeio-security-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # Add wakeio-security-ci to this project's dependencies before using the template.
      # For an unpublished build, use a reviewed relative file:vendor/*.tgz dependency.
      - name: Install declared dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run installed Wakeio CLI
      # No Python files were detected by the bounded static inventory; Bandit is not applicable.
        run: >-
          npx --no-install wakeio-security-ci scan --source . --project-id "$GITHUB_REPOSITORY" --tools none --out 'wakeio-security-reports'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wakeio-security-reports
          path: "wakeio-security-reports"
          if-no-files-found: error
